name            = "bey-state-do"
main            = "src/index.js"
compatibility_date = "2024-09-02"

# This Worker exists solely to host the BeyStateDO Durable Object class.
# It has no public HTTP routes — all traffic reaches the DO through the
# Pages Function service binding (env.BEY_STATE_DO), not through this
# Worker's URL directly.

[[durable_objects.bindings]]
name       = "BEY_STATE_DO"
class_name = "BeyStateDO"

# KV binding so the single registry DO instance (idFromName('__events_registry__'))
# can serialize read-modify-write of the `events` blob. Same namespace the Pages
# project binds as BEYBLADE_KV.
[[kv_namespaces]]
binding = "BEYBLADE_KV"
id      = "cb6f3ae6f2cd4c07b9815af5d3e31d30"

[[migrations]]
tag         = "v1"
new_sqlite_classes = ["BeyStateDO"]
